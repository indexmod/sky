<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>Sky</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  /* ширина белой рамы */
  --edge-size: clamp(8px, calc(2vw - 2px), 28px);

  /* отражение той же ширины */
  --reflection-size: var(--edge-size);

  /* черное паспарту той же ширины */
  --mat-size: var(--edge-size);
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #000;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}


/* ==========================================
   BLACK MAT
   ========================================== */

.sky {
  position: fixed;

  /* черное паспарту вокруг изображения */
  inset: var(--mat-size);

  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      #62b9ff 0%,
      #3298f7 30%,
      #1178e5 62%,
      #0759bd 100%
    );

  transition: background 1.4s ease;
}


/* ==========================================
   DAY — INNER REFLECTION
   ========================================== */

.bottom-reflection {
  position: absolute;

  left: 0;
  right: var(--edge-size);
  bottom: var(--edge-size);

  height: var(--reflection-size);

  background: #78b8e8;

  opacity: 1;
  transform: translateY(0);

  transition:
    opacity 1.4s ease,
    transform 1.4s ease;
}

.right-reflection {
  position: absolute;

  top: 0;
  right: var(--edge-size);
  bottom: var(--edge-size);

  width: var(--reflection-size);

  background: #78b8e8;

  opacity: 1;
  transform: translateX(0);

  transition:
    opacity 1.4s ease,
    transform 1.4s ease;
}


/* ==========================================
   DAY — WHITE L FRAME
   ========================================== */

.bottom-edge {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: var(--edge-size);

  background: #fff;

  opacity: 1;
  transform: translateY(0);

  transition:
    opacity 1.4s ease,
    transform 1.4s ease;
}

.right-edge {
  position: absolute;

  top: 0;
  right: 0;
  bottom: 0;

  width: var(--edge-size);

  background: #FF9900;

  opacity: 1;
  transform: translateX(0);

  transition:
    opacity 1.4s ease,
    transform 1.4s ease;
}


/* ==========================================
   SUNSET — NO FRAME
   ========================================== */

body.sunset .sky {
  background:
    linear-gradient(
      180deg,
      #fff0a0 0%,
      #ffd15c 24%,
      #f7a137 50%,
      #e77632 74%,
      #c84c32 100%
    );
}

body.sunset .bottom-edge,
body.sunset .bottom-reflection {
  opacity: 0;
  transform: translateY(110%);
}

body.sunset .right-edge,
body.sunset .right-reflection {
  opacity: 0;
  transform: translateX(110%);
}


/* ==========================================
   REDUCED MOTION
   ========================================== */

@media (prefers-reduced-motion: reduce) {
  .sky,
  .bottom-edge,
  .right-edge,
  .bottom-reflection,
  .right-reflection {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="sky">

  <!-- light blue reflection -->
  <div class="bottom-reflection"></div>
  <div class="right-reflection"></div>

  <!-- white L frame -->
  <div class="bottom-edge"></div>
  <div class="right-edge"></div>

</div>

<script>
(() => {
  function toggleSky() {
    document.body.classList.toggle("sunset");
  }

  document.addEventListener("click", toggleSky);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      toggleSky();
    }
  });
})();
</script>

</body>
</html>
