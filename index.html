<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>Sky</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  /* оранжевый край — в 2 раза шире */
  --edge-size: clamp(16px, calc(4vw - 4px), 56px);

  /* отражение — тоже в 2 раза шире */
  --reflection-size: var(--edge-size);
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #1178e5;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;

  /* DAY — без градиента */
  background: #1178e5;
}


/* ==========================================
   DAY — REFLECTION AROUND FULL PERIMETER
   ========================================== */

.reflection {
  position: absolute;

  inset: var(--edge-size);

  border: var(--reflection-size) solid #78b8e8;

  pointer-events: none;
}


/* ==========================================
   DAY — ORANGE FRAME AROUND FULL PERIMETER
   ========================================== */

.edge {
  position: absolute;

  inset: 0;

  border: var(--edge-size) solid #FF9900;

  pointer-events: none;
}


/* ==========================================
   SUNSET
   ========================================== */

body.sunset .sky {
  background:
    linear-gradient(
      180deg,
      #fff0a0 0%,
      #ffd15c 24%,
      #f7a137 50%,
      #e77632 74%,
      #c84c32 100%
    );
}

body.sunset .edge,
body.sunset .reflection {
  display: none;
}
</style>
</head>

<body>

<div class="sky">

  <!-- reflection around full perimeter -->
  <div class="reflection"></div>

  <!-- orange frame around full perimeter -->
  <div class="edge"></div>

</div>

<script>
(() => {
  function toggleSky() {
    document.body.classList.toggle("sunset");
  }

  document.addEventListener("click", toggleSky);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      toggleSky();
    }
  });
})();
</script>

</body>
</html>
